[main]
font=JetBrainsMono Nerd Font:style=Regular:size=15
pad=14x14

[cursor]
style=block
blink=no

[colors]
background=161616
foreground=f2f4f8

## Normal colors (palette base values)
regular0=282828   # black
regular1=ee5396   # red
regular2=25be6a   # green
regular3=08bdba   # yellow (carbonfox maps this to teal)
regular4=78a9ff   # blue
regular5=be95ff   # magenta
regular6=33b1ff   # cyan
regular7=dfdfe0   # white

## Bright colors (palette bright variants, approximated)
bright0=484848
bright1=f16da6
bright2=46c880
bright3=2dc7c4
bright4=8cb6ff
bright5=c8a5ff
bright6=52bdff
bright7=e4e4e5

## Extras
selection-foreground=f2f4f8
selection-background=525253   # sel1
cursor=161616 f2f4f8          # text color, cursor color
urls=78a9ff

[mouse]
hide-when-typing=yes

[csd]
preferred=none
